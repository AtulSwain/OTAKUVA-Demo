version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # Non-security version bumps land as one batched PR per week instead
      # of dozens of individual ones; security advisories still always get
      # their own immediate PR regardless of this grouping (Dependabot's
      # default behavior).
      routine:
        applies-to: version-updates
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
